<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Designbase</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type='text/tailwindcss'>
    body {
      @apply p-12;
    }

    .cards {
      @apply min-h-screen grid gap-4;
      grid-template-columns: repeat(auto-fit, 25rem);
    }

    .card {
      @apply aspect-square bg-zinc-100 rounded-md overflow-hidden;

      > video {
        @apply object-cover w-full h-full min-w-0 min-h-0;
      }
    }
  </style>
</head>

<body>
  <button class='open-folder cursor-pointer'>open folder</button>
  <div class='cards'></div>
  <script type='module' src='main.ts'></script>
</body>

</html>
