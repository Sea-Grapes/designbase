<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Designbase</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type='text/tailwindcss'>
    body {
      @apply p-4 md:p-12 space-y-8;
    }



    .menu {
      @apply flex gap-4;
    }

    button.open-folder {
      @apply block text-nowrap p-2;
    }

    input[name='search'] {
      @apply w-full p-2 px-3 bg-zinc-100 rounded-md;
    }

    .cards {
      @apply min-h-screen grid gap-4;
      align-items: start;
      grid-template-columns: repeat(auto-fit, minmax(min(25rem, 100%), 25rem));
    }

    .card {

      > video {
        @apply aspect-square object-cover w-full min-w-0 min-h-0  border border-zinc-200 shadow-sm rounded-xl overflow-hidden;
      }
    }
  </style>
</head>

<body>
  <div class='menu'>
    <button class='open-folder cursor-pointer'>open folder</button>
    <input name='search' type='text' placeholder='search'>
  </div>
  <div class='cards'></div>
  <script type='module' src='main.ts'></script>
</body>

</html>
